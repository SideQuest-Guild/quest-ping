name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  addon:
    name: Addon (LuaJIT tests + luacheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LuaJIT and luacheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q luajit luarocks
          sudo luarocks install luacheck

      - name: Run addon test suite
        run: luajit tests/run_tests.lua

      - name: luacheck
        run: luacheck QuestPing tests
