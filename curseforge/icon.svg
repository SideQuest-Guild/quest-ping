<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#22355a"/>
      <stop offset="0.6" stop-color="#0f1a2e"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7dc7a"/>
      <stop offset="0.5" stop-color="#c9952b"/>
      <stop offset="1" stop-color="#7a5212"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7448"/>
      <stop offset="0.55" stop-color="#e2321b"/>
      <stop offset="1" stop-color="#8f0f07"/>
    </linearGradient>
    <linearGradient id="bang" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="1" stop-color="#ffc400"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- ping ripples on the ground -->
  <ellipse cx="256" cy="378" rx="210" ry="70" fill="url(#glow)"/>
  <ellipse cx="256" cy="378" rx="196" ry="62" fill="none" stroke="#ff6a3d" stroke-width="7" opacity="0.3"/>
  <ellipse cx="256" cy="378" rx="136" ry="43" fill="none" stroke="#ff6a3d" stroke-width="9" opacity="0.6"/>
  <ellipse cx="256" cy="378" rx="76" ry="24" fill="none" stroke="#ff8a5c" stroke-width="11" opacity="0.95"/>

  <!-- the ping pin -->
  <path d="M256 384 C198 318 146 278 146 214 A110 110 0 1 1 366 214 C366 278 314 318 256 384 Z"
        fill="url(#pin)" stroke="#2a0703" stroke-width="10" stroke-linejoin="round"/>
  <path d="M176 196 A82 82 0 0 1 300 132" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"
        opacity="0.35"/>

  <!-- the quest mark -->
  <rect x="234" y="128" width="44" height="104" rx="22" fill="url(#bang)" stroke="#3a2400" stroke-width="7"/>
  <circle cx="256" cy="268" r="23" fill="url(#bang)" stroke="#3a2400" stroke-width="7"/>

  <!-- gilded frame -->
  <rect x="12" y="12" width="488" height="488" rx="34" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <rect x="24" y="24" width="464" height="464" rx="26" fill="none" stroke="#000000" stroke-opacity="0.55"
        stroke-width="3"/>
</svg>
